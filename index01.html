<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHK 일본말 첫걸음 - AI 롤플레이 & 말하기 스튜디오</title>

  <!-- PWA 매니페스트 및 모바일 테마 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f43f5e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- 서비스 워커(sw.js) 등록 스크립트 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('일본어 SW 등록 성공:', reg.scope))
          .catch(err => console.log('일본어 SW 등록 실패:', err));
      });
    }
  </script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #f43f5e;
      --primary-hover: #e11d48;
      --accent-sakura: #fda4af;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-blue: #38bdf8;
      --role-tam: #ec4899;
      --role-kaito: #3b82f6;
      --role-miya: #a855f7;
      --role-haru: #10b981;
      --role-other: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.6;
    }

    .container { max-width: 820px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
    }
    header h1 {
      font-size: 1.45rem;
      color: var(--accent-sakura);
      margin-bottom: 6px;
      font-weight: 800;
    }
    .badge-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.78rem;
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 3px 12px;
      border-radius: 12px;
      color: var(--text-sub);
    }
    .badge.active { color: var(--accent-sakura); border-color: var(--accent-sakura); }

    /* 네비게이션 바 */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .nav-btn {
      background: #334155;
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-btn:hover:not(:disabled) { background: #475569; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .lesson-select {
      flex: 1;
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .lesson-select option { background: #0f172a; color: #fff; }

    /* 컨트롤 바 */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .ctrl-btn {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: #475569; color: #fff; }
    .play-btn {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      border: none;
    }
    .play-btn:hover { background: var(--primary-hover); }
    .play-btn.playing { background: #dc2626; }

    /* 섹션 제목 */
    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-sakura);
      margin: 22px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 카드 리스트 */
    .dialogue-list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      transition: all 0.25s ease;
    }
    .card.active-playing {
      border-color: var(--primary);
      background-color: #2a1f33;
    }

    .card-main-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .kr-container { display: flex; align-items: flex-start; gap: 10px; flex: 1; }
    .toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: #334155;
      color: var(--accent-sakura);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
      flex-shrink: 0;
      cursor: pointer;
      margin-top: 2px;
    }
    .card.open .toggle-btn {
      transform: rotate(90deg);
      background-color: var(--primary);
      color: white;
    }
    .speaker-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      color: white;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .speaker-Tam { background-color: var(--role-tam); }
    .speaker-Kaito { background-color: var(--role-kaito); }
    .speaker-Miya { background-color: var(--role-miya); }
    .speaker-Haru { background-color: var(--role-haru); }
    .speaker-Ayaka { background-color: #eab308; color: #000; }
    .speaker-Mike { background-color: #06b6d4; }
    .speaker-Staff { background-color: var(--role-other); }

    .kr-text-wrap { flex: 1; }
    .kr-text { font-size: 1.05rem; font-weight: 700; color: #f8fafc; line-height: 1.45; }

    .actions-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-record {
      background-color: #451a24;
      color: var(--accent-sakura);
      border: 1px solid #881337;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-record:hover { background-color: #701a30; }
    .btn-record.recording {
      background-color: #dc2626;
      color: white;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* 발화 분석 결과 패널 */
    .analysis-panel {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
    }
    .analysis-panel.show { display: block; }
    .panel-header {
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .score-badge { padding: 2px 8px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; }
    .score-high { background: #14532d; color: #86efac; }
    .score-mid { background: #713f12; color: #fde047; }
    .score-low { background: #7f1d1d; color: #fca5a5; }
    .speech-transcript { font-size: 0.92rem; margin-bottom: 6px; color: #cbd5e1; }
    .diff-box {
      font-size: 0.9rem;
      padding: 8px 10px;
      background: #1e293b;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .match-char { color: #4ade80; font-weight: 700; }
    .miss-char { color: #f87171; text-decoration: line-through; }

    /* 일본어 정답 패널 */
    .jp-panel {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--card-border);
    }
    .card.open .jp-panel { display: block; }
    .jp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .jp-text { font-size: 1.15rem; font-weight: 700; color: #ffffff; }
    .romaji-text { font-size: 0.88rem; color: var(--accent-sakura); margin-bottom: 8px; }
    .btn-tts {
      background-color: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-tts:hover { background-color: #475569; color: #fff; }
    .note-box {
      background-color: #1e1b4b;
      border: 1px solid #3730a3;
      color: #c7d2fe;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    /* 중요 표현 & 추가 표현 특별 카드 */
    .keyphrase-card {
      background: linear-gradient(135deg, #1e293b, #1f1d36);
      border: 2px solid #881337;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .cando-badge {
      display: inline-block;
      background: #e11d48;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .keyphrase-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    .keyphrase-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 8px;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }

    /* 연습문제 리스트 */
    .practice-item {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .practice-q { font-size: 0.95rem; font-weight: 700; color: var(--accent-yellow); margin-bottom: 4px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌸 NHK 일본말 첫걸음 스튜디오</h1>
    <div class="badge-bar">
      <span class="badge active" id="badgeCanDo">🎯 Can-do 로딩 중...</span>
      <span class="badge" id="badgeVoice">🎙️ 일본어 음성 엔진 준비 중</span>
    </div>
  </header>

  <!-- 1. 네비게이션 드롭다운 -->
  <div class="nav-bar">
    <button id="prevBtn" class="nav-btn" onclick="navLesson(-1)">◀ 이전</button>
    <select id="lessonSelect" class="lesson-select" onchange="changeLesson(this.value)"></select>
    <button id="nextBtn" class="nav-btn" onclick="navLesson(1)">다음 ▶</button>
  </div>

  <!-- 2. 컨트롤 패널 -->
  <div class="control-panel">
    <div class="btn-group">
      <button id="playAllBtn" class="ctrl-btn play-btn" onclick="togglePlayAll()">
        ▶ 대화 연속 롤플레이
      </button>
    </div>
    <div class="btn-group">
      <button class="ctrl-btn" onclick="toggleAllCards(true)">전체 정답 열기</button>
      <button class="ctrl-btn" onclick="toggleAllCards(false)">전체 접기</button>
    </div>
  </div>

  <!-- 3. 섹션 1: 오늘의 대화 -->
  <div class="section-title">🎬 1. 오늘의 대화 (롤플레이)</div>
  <div id="dialogueList" class="dialogue-list"></div>

  <!-- 4. 섹션 2: 중요 표현 & Can-do 해설 -->
  <div class="section-title">⭐ 2. 오늘의 중요 표현 (Can-do 문법)</div>
  <div id="keyPhraseBox"></div>

  <!-- 5. 섹션 3: 사용해 봅시다! -->
  <div class="section-title">💬 3. 사용해 봅시다! (실전 응용 회화)</div>
  <div id="tryItBox" class="dialogue-list"></div>

  <!-- 6. 섹션 4: 말할 수 있어요? -->
  <div class="section-title">🎯 4. 말할 수 있어요? (패턴 드릴 연습)</div>
  <div id="practiceBox"></div>

  <!-- 7. 섹션 5: 오늘의 추가 표현 -->
  <div class="section-title">💡 5. 오늘의 추가 표현 (보너스)</div>
  <div id="bonusBox"></div>
</div>

<!-- data.js 연동 (실제 교재 1~12강 데이터) -->
<script src="data.js"></script>

<script>
  let lessons = (typeof courseData !== "undefined" && courseData.lessons) ? courseData.lessons : [];
  let currentLessonIdx = 0;
  let isPlayingAll = false;
  let currentPlayIdx = 0;
  let femaleVoice = null;
  let maleVoice = null;
  let recognition = null;
  let activeRecordingId = null;
  let speechSilenceTimer = null;
  let accumulatedTranscript = "";

  // Web Speech STT (음성 인식: 일본어 ja-JP)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
  }

  // Web Speech TTS (음성 합성: 일본어 ja-JP)
  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    const jaVoices = voices.filter(v => v.lang.startsWith("ja"));
    femaleVoice = jaVoices.find(v => /Kyoko|Otoya|Ayumi|Nanami|Haruka/i.test(v.name)) || jaVoices[0] || null;
    maleVoice = jaVoices.find(v => /Otoya|Keita|Naoki|Daichi/i.test(v.name)) || jaVoices[1] || jaVoices[0] || null;

    const vBadge = document.getElementById("badgeVoice");
    if (vBadge) {
      vBadge.textContent = jaVoices.length > 0 ? "🎙️ 일본어 음성 엔진 준비 완료" : "🎙️ 기본 음성 엔진 연결";
    }
  }
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 300);

  function initSelect() {
    const sel = document.getElementById("lessonSelect");
    if (!sel || lessons.length === 0) return;
    sel.innerHTML = lessons.map((l, i) => `
      <option value="${i}">LESSON ${String(l.lesson).padStart(2, '0')}: ${l.title}</option>
    `).join("");
    updateNavButtons();
  }

  function updateNavButtons() {
    document.getElementById("prevBtn").disabled = (currentLessonIdx <= 0);
    document.getElementById("nextBtn").disabled = (currentLessonIdx >= lessons.length - 1);
  }

  function navLesson(delta) {
    const target = currentLessonIdx + delta;
    if (target >= 0 && target < lessons.length) {
      document.getElementById("lessonSelect").value = target;
      changeLesson(target);
    }
  }

  function changeLesson(idx) {
    if (isPlayingAll) stopPlayAll();
    currentLessonIdx = parseInt(idx);
    updateNavButtons();
    renderLesson();
  }

  function renderLesson() {
    const cur = lessons[currentLessonIdx];
    if (!cur) return;

    document.getElementById("badgeCanDo").textContent = `🎯 Can-do: ${cur.canDo}`;

    // 1. 대화문 리스트 렌더링
    const diagListEl = document.getElementById("dialogueList");
    diagListEl.innerHTML = cur.dialogues.map((d, i) => buildCardHtml(d, `diag-${i}`)).join("");

    // 2. 중요 표현 렌더링
    const kpBox = document.getElementById("keyPhraseBox");
    kpBox.innerHTML = `
      <div class="keyphrase-card">
        <span class="cando-badge">Can-do! ${cur.canDo}</span>
        <div class="jp-row" style="margin-top:4px;">
          <div class="keyphrase-title">${cur.keyPhrase.jp}</div>
          <div style="display:flex; gap:6px;">
            <button class="btn-tts" onclick="speakText('${cur.keyPhrase.jp.replace(/'/g, "\'")}', 'female')">🔊 원문 듣기</button>
            <button class="btn-record" id="rec-btn-kp" onclick="startSpeaking('kp', '${cur.keyPhrase.jp.replace(/'/g, "\'")}')">🎙️ 말하기</button>
          </div>
        </div>
        <div class="romaji-text">${cur.keyPhrase.romaji}</div>
        <div style="font-size:1.05rem; font-weight:700; color:#38bdf8; margin-bottom:8px;">${cur.keyPhrase.kr}</div>
        <div class="keyphrase-desc">${cur.keyPhrase.desc}</div>

        <div class="analysis-panel" id="analysis-kp">
          <div class="panel-header">
            <span>🗣️ 내 발화 분석 결과</span>
            <span class="score-badge" id="score-kp">일치도: -%</span>
          </div>
          <div class="speech-transcript" id="transcript-kp">인식 중...</div>
          <div class="diff-box" id="diff-kp"></div>
        </div>
      </div>
    `;

    // 3. 사용해 봅시다!
    const tryBox = document.getElementById("tryItBox");
    if (cur.tryIt && cur.tryIt.length > 0) {
      tryBox.innerHTML = cur.tryIt.map((item, i) => `
        <div class="card open" id="card-try-${i}">
          <div class="card-main-row">
            <div class="kr-container">
              <span class="speaker-badge speaker-${item.speaker === 'A' ? 'Tam' : 'Kaito'}">${item.speaker}</span>
              <div class="kr-text-wrap">
                <div class="kr-text">${item.kr}</div>
              </div>
            </div>
            <div class="actions-wrap">
              <button class="btn-tts" onclick="speakText('${item.jp.replace(/'/g, "\'")}', '${item.speaker === 'A' ? 'female' : 'male'}')">🔊 듣기</button>
            </div>
          </div>
          <div class="jp-panel" style="display:block;">
            <div class="jp-text">${item.jp}</div>
            <div class="romaji-text">${item.romaji}</div>
          </div>
        </div>
      `).join("");
    } else {
      tryBox.innerHTML = `<div style="color:var(--text-sub); padding:10px;">등록된 응용 표현이 없습니다.</div>`;
    }

    // 4. 말할 수 있어요? 연습문제
    const pracBox = document.getElementById("practiceBox");
    if (cur.practice && cur.practice.length > 0) {
      pracBox.innerHTML = cur.practice.map((p, i) => `
        <div class="practice-item">
          <div class="practice-q">연습 ${i+1}. ${p.q}</div>
          <div class="jp-row" style="margin-top:6px;">
            <div>
              <div style="font-size:1.05rem; font-weight:700; color:#fff;">${p.answerJp}</div>
              <div style="font-size:0.85rem; color:var(--accent-sakura);">${p.answerRomaji}</div>
              <div style="font-size:0.9rem; color:#94a3b8;">${p.kr}</div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn-tts" onclick="speakText('${p.answerJp.replace(/'/g, "\'")}', 'female')">🔊 정답 듣기</button>
              <button class="btn-record" id="rec-btn-prac-${i}" onclick="startSpeaking('prac-${i}', '${p.answerJp.replace(/'/g, "\'")}')">🎙️ 말하기</button>
            </div>
          </div>
          <div class="analysis-panel" id="analysis-prac-${i}">
            <div class="panel-header">
              <span>🗣️ 내 발화 분석 결과</span>
              <span class="score-badge" id="score-prac-${i}">일치도: -%</span>
            </div>
            <div class="speech-transcript" id="transcript-prac-${i}">인식 중...</div>
            <div class="diff-box" id="diff-prac-${i}"></div>
          </div>
        </div>
      `).join("");
    } else {
      pracBox.innerHTML = `<div style="color:var(--text-sub); padding:10px;">등록된 연습문제가 없습니다.</div>`;
    }

    // 5. 오늘의 추가 표현
    const bonusBox = document.getElementById("bonusBox");
    if (cur.bonus) {
      bonusBox.innerHTML = `
        <div class="keyphrase-card" style="border-color:#38bdf8;">
          <div class="jp-row">
            <div class="keyphrase-title" style="color:var(--accent-blue);">${cur.bonus.jp}</div>
            <button class="btn-tts" onclick="speakText('${cur.bonus.jp.replace(/'/g, "\'")}', 'female')">🔊 듣기</button>
          </div>
          <div class="romaji-text">${cur.bonus.romaji}</div>
          <div style="font-size:1.05rem; font-weight:700; color:#fff; margin-bottom:6px;">${cur.bonus.kr}</div>
          <div class="keyphrase-desc">${cur.bonus.desc}</div>
        </div>
      `;
    } else {
      bonusBox.innerHTML = "";
    }
  }

  function buildCardHtml(item, uniqueId) {
    return `
      <div class="card" id="card-${uniqueId}">
        <div class="card-main-row">
          <div class="kr-container">
            <button class="toggle-btn" onclick="toggleCard('${uniqueId}')" title="정답 토글">▶</button>
            <span class="speaker-badge speaker-${item.role}">${item.roleLabel || item.role}</span>
            <div class="kr-text-wrap">
              <div class="kr-text">${item.kr}</div>
            </div>
          </div>
          <div class="actions-wrap">
            <button class="btn-record" id="rec-btn-${uniqueId}" onclick="startSpeaking('${uniqueId}', '${item.jp.replace(/'/g, "\'")}')">
              🎙️ 말하기
            </button>
          </div>
        </div>

        <div class="analysis-panel" id="analysis-${uniqueId}">
          <div class="panel-header">
            <span>🗣️ 내 발화 분석 결과</span>
            <span class="score-badge" id="score-${uniqueId}">일치도: -%</span>
          </div>
          <div class="speech-transcript" id="transcript-${uniqueId}">인식 중...</div>
          <div class="diff-box" id="diff-${uniqueId}"></div>
        </div>

        <div class="jp-panel">
          <div class="jp-row">
            <span class="jp-text">${item.jp}</span>
            <button class="btn-tts" onclick="speakSingle('${uniqueId}')">🔊 원문 듣기</button>
          </div>
          <div class="romaji-text">${item.romaji}</div>
          ${item.note ? `<div class="note-box">💡 어휘: ${item.note}</div>` : ''}
        </div>
      </div>
    `;
  }

  function toggleCard(uniqueId) {
    document.getElementById(`card-${uniqueId}`).classList.toggle("open");
  }

  function toggleAllCards(open) {
    document.querySelectorAll(".card").forEach(c => {
      if (open) c.classList.add("open");
      else c.classList.remove("open");
    });
  }

  function speakText(text, gender, onEnd) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ja-JP";
    utter.rate = 0.95;
    if (gender === "male") {
      if (maleVoice) utter.voice = maleVoice;
      utter.pitch = 0.88;
    } else {
      if (femaleVoice) utter.voice = femaleVoice;
      utter.pitch = 1.05;
    }
    if (onEnd) {
      utter.onend = onEnd;
      utter.onerror = onEnd;
    }
    window.speechSynthesis.speak(utter);
  }

  function speakSingle(uniqueId) {
    if (isPlayingAll) stopPlayAll();
    const cur = lessons[currentLessonIdx];
    const idx = parseInt(uniqueId.replace("diag-", ""));
    const item = cur.dialogues[idx];
    const card = document.getElementById(`card-${uniqueId}`);
    
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active-playing"));
    card.classList.add("active-playing");
    speakText(item.jp, item.gender, () => {
      card.classList.remove("active-playing");
    });
  }

  function togglePlayAll() {
    if (isPlayingAll) stopPlayAll();
    else startPlayAll();
  }

  function startPlayAll() {
    isPlayingAll = true;
    currentPlayIdx = 0;
    const btn = document.getElementById("playAllBtn");
    btn.innerHTML = "⏹ 연속 듣기 정지";
    btn.classList.add("playing");
    toggleAllCards(true);
    playNextSequence();
  }

  function stopPlayAll() {
    isPlayingAll = false;
    window.speechSynthesis.cancel();
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active-playing"));
    const btn = document.getElementById("playAllBtn");
    if (btn) {
      btn.innerHTML = "▶ 대화 연속 롤플레이";
      btn.classList.remove("playing");
    }
  }

  function playNextSequence() {
    const cur = lessons[currentLessonIdx];
    if (!isPlayingAll || currentPlayIdx >= cur.dialogues.length) {
      stopPlayAll();
      return;
    }
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active-playing"));
    const card = document.getElementById(`card-diag-${currentPlayIdx}`);
    if (card) {
      card.classList.add("active-playing");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    const item = cur.dialogues[currentPlayIdx];
    speakText(item.jp, item.gender, () => {
      if (!isPlayingAll) return;
      currentPlayIdx++;
      setTimeout(playNextSequence, 600);
    });
  }

  function startSpeaking(uniqueId, targetJp) {
    if (!recognition) {
      alert("현재 브라우저에서는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 이용해 주세요.");
      return;
    }

    if (activeRecordingId !== null) {
      if (activeRecordingId === uniqueId) {
        finishSpeaking(uniqueId, targetJp);
      } else {
        recognition.stop();
      }
      return;
    }

    activeRecordingId = uniqueId;
    accumulatedTranscript = "";
    if (speechSilenceTimer) clearTimeout(speechSilenceTimer);

    const btn = document.getElementById(`rec-btn-${uniqueId}`);
    btn.classList.add("recording");
    btn.innerHTML = "⏹️ 완료";

    const panel = document.getElementById(`analysis-${uniqueId}`);
    panel.classList.add("show");
    document.getElementById(`transcript-${uniqueId}`).innerHTML = `<strong>인식 중...</strong> <span style="color:#f43f5e;">일본어로 말씀해 보세요.</span>`;

    recognition.onresult = (event) => {
      let interim = "";
      let final = "";
      for (let i = 0; i < event.results.length; ++i) {
        if (event.results[i].isFinal) final += event.results[i][0].transcript + " ";
        else interim += event.results[i][0].transcript;
      }
      accumulatedTranscript = (final + interim).trim();
      document.getElementById(`transcript-${uniqueId}`).innerHTML = `<strong>인식된 문장:</strong> "${accumulatedTranscript}"`;

      if (speechSilenceTimer) clearTimeout(speechSilenceTimer);
      speechSilenceTimer = setTimeout(() => {
        finishSpeaking(uniqueId, targetJp);
      }, 3000);
    };

    recognition.onerror = (event) => {
      if (event.error !== "no-speech") console.error("STT 에러:", event.error);
      resetRecButton(uniqueId);
      activeRecordingId = null;
    };

    recognition.onend = () => {
      if (activeRecordingId !== null && accumulatedTranscript) {
        analyzeSpeech(uniqueId, targetJp, accumulatedTranscript);
      }
      resetRecButton(uniqueId);
      activeRecordingId = null;
    };

    recognition.start();
  }

  function finishSpeaking(uniqueId, targetJp) {
    if (speechSilenceTimer) clearTimeout(speechSilenceTimer);
    recognition.stop();
    resetRecButton(uniqueId);
    if (accumulatedTranscript) {
      analyzeSpeech(uniqueId, targetJp, accumulatedTranscript);
    }
    activeRecordingId = null;
  }

  function resetRecButton(uniqueId) {
    const btn = document.getElementById(`rec-btn-${uniqueId}`);
    if (btn) {
      btn.classList.remove("recording");
      btn.innerHTML = "🎙️ 말하기";
    }
  }

  function cleanJapanese(str) {
    return str.replace(/[\s\p{P}\p{S}]/gu, '');
  }

  function levenshtein(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        if (b.charAt(i - 1) === a.charAt(j - 1)) {
          matrix[i][j] = matrix[i - 1][j - 1];
        } else {
          matrix[i][j] = Math.min(
            matrix[i - 1][j - 1] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j] + 1
          );
        }
      }
    }
    return matrix[b.length][a.length];
  }

  function analyzeSpeech(uniqueId, targetJp, userSpoken) {
    const cleanTarget = cleanJapanese(targetJp);
    const cleanUser = cleanJapanese(userSpoken);

    const dist = levenshtein(cleanTarget, cleanUser);
    const maxLen = Math.max(cleanTarget.length, cleanUser.length);
    const score = maxLen === 0 ? 100 : Math.max(0, Math.round(((maxLen - dist) / maxLen) * 100));

    const panel = document.getElementById(`analysis-${uniqueId}`);
    panel.classList.add("show");

    const scoreEl = document.getElementById(`score-${uniqueId}`);
    scoreEl.textContent = `일치도: ${score}%`;
    scoreEl.className = "score-badge " + (score >= 80 ? "score-high" : score >= 50 ? "score-mid" : "score-low");

    document.getElementById(`transcript-${uniqueId}`).innerHTML = `<strong>인식된 문장:</strong> "${userSpoken}"`;

    const diffHtml = cleanTarget.split('').map(c => {
      return cleanUser.includes(c) ? `<span class="match-char">${c}</span>` : `<span class="miss-char">${c}</span>`;
    }).join('');

    document.getElementById(`diff-${uniqueId}`).innerHTML = `
      <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:4px;">목표 문장 글자 대조 (<span style="color:#4ade80">초록: 일치</span>, <span style="color:#f87171; text-decoration:line-through">빨강: 미흡</span>):</div>
      ${diffHtml}
    `;

    const card = document.getElementById(`card-${uniqueId}`);
    if (card) card.classList.add("open");
  }

  // 앱 시작
  if (lessons.length > 0) {
    initSelect();
    changeLesson(0);
  } else {
    document.getElementById("dialogueList").innerHTML = `<div style="padding:20px; text-align:center; color:#f87171;">⚠️ data.js 파일을 불러오지 못했습니다. 동일 폴더에 data.js가 있는지 확인해 주세요.</div>`;
  }
</script>
